name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  model-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # A cost tool quoting stale prices is worse than one that admits it does
      # not know. Fail the build rather than let the table rot silently.
      # dist/*.js is committed because the composite Action loads it from a tag.
      # Committed build output rots silently, so this is the fence: rebuild and
      # require the tree to be unchanged. A stale dist/ means everyone on `@v0` is
      # running last month's cost model.
      - name: the committed dist matches src
        run: |
          if ! git diff --exit-code -- 'dist/*.js'; then
            echo "::error::dist/*.js is stale — run pnpm build and commit the result"
            exit 1
          fi
          echo "ok  committed dist matches src"

      - name: the Action entrypoint runs with no node_modules, like a consumer's
        run: |
          # A consumer on `@v0` gets a bare git checkout of the tag: committed
          # files, no install. Running the entrypoint *here* would pass on this
          # repo's node_modules and hide exactly the bug this step exists for —
          # dist/spec.js imports acorn, so the unbundled entrypoint died with
          # ERR_MODULE_NOT_FOUND for anyone who ever used the documented snippet.
          # So copy it somewhere with no node_modules and run it there.
          test -f dist/action.bundle.js || { echo "::error::dist/action.bundle.js not committed"; exit 1; }
          T=$(mktemp -d)
          mkdir -p "$T/test/fixtures"
          cp dist/action.bundle.js "$T/"
          cp test/fixtures/audit.graph.json "$T/test/fixtures/"
          git -C "$T" init -q .
          git -C "$T" -c user.email=ci@example.com -c user.name=ci add -A
          git -C "$T" -c user.email=ci@example.com -c user.name=ci commit -q -m fixture
          # Assert on GITHUB_OUTPUT, not stdout: the action appends its outputs to
          # that file whenever it is set, and it is always set on a runner. Grepping
          # stdout passes locally and fails here, which is how this step first went
          # red on a run that had worked perfectly.
          ( cd "$T" && GITHUB_OUTPUT="$T/out.txt" PREFLIGHT_PATHS='test/fixtures/*.graph.json' \
              PREFLIGHT_COMMENT=false node action.bundle.js > /dev/null )
          grep -q '^usd=0\.97$' "$T/out.txt" || {
            echo "::error::standalone entrypoint did not price the fixture"; cat "$T/out.txt"; exit 1;
          }
          grep -q '^agents=114$' "$T/out.txt" || {
            echo "::error::standalone entrypoint reported the wrong agent count"; cat "$T/out.txt"; exit 1;
          }
          echo "ok  action entrypoint runs standalone: $(tr '\n' ' ' < "$T/out.txt")"

      # Calibration is the one place preflight writes a number that looks
      # measured. These assert that it stays honest about what it did and did not
      # measure, and that it refuses rather than half-calibrating.
      - name: calibrate refuses a sample too small to mean anything
        run: |
          printf '%s\n' '[{"prompt_tokens":1000,"completion_tokens":100},{"prompt_tokens":2000,"completion_tokens":200}]' > tiny.json
          if node dist/cli.js calibrate tiny.json --out should-not-exist.json 2>/dev/null; then
            echo "::error::calibrate accepted a 2-record sample"
            exit 1
          fi
          if [ -f should-not-exist.json ]; then
            echo "::error::calibrate wrote a config it said it was refusing to write"
            exit 1
          fi
          echo "ok  calibrate refuses below the sample floor and writes nothing"

      - name: calibrate writes the median and never invents a cache hit rate
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            // Skewed on purpose: one 400k-context run among six small ones. A mean
            // would land near 67k; the median must not move with it.
            const rows = [[1000,100],[1100,110],[1200,120],[1300,130],[1400,140],[400000,200]]
              .map(([p,c]) => ({ model: 'claude-opus-5', prompt_tokens: p, completion_tokens: c, total_tokens: p+c }));
            writeFileSync('usage.json', JSON.stringify(rows));
          "
          node dist/cli.js calibrate usage.json --out cal.json 2>/dev/null
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const c = JSON.parse(readFileSync('cal.json','utf8'));
            const w = c.profiles.worker;
            if (w.input > 100000) throw new Error('calibrated to the mean, not the median: ' + w.input);
            if (w.cacheHitRate !== 0.7) throw new Error('cacheHitRate was not carried through: ' + w.cacheHitRate);
            const prov = c.\$calibration.worker;
            if (prov.samples !== 6) throw new Error('wrong sample count: ' + prov.samples);
            if (!/not measured/.test(prov.cacheHitRate)) throw new Error('provenance does not admit the cache rate is unmeasured');
            if (!prov.calibratedOn) throw new Error('no calibration date recorded');
            if (prov.inputTokens.p90 !== 400000) throw new Error('the tail was not reported');
            console.log('ok  calibrated input', w.input, '(median), p90', prov.inputTokens.p90, ', cacheHitRate untouched');
          "

      - name: a calibrated config actually changes the estimate
        run: |
          # If the emitted shape did not match what `estimate` reads, the whole
          # command would be a no-op that looked like it worked.
          node dist/cli.js estimate test/fixtures/audit.graph.json --format json > plain.json
          node dist/cli.js estimate test/fixtures/audit.graph.json --format json --config cal.json > tuned.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const a = JSON.parse(readFileSync('plain.json','utf8')).after;
            const b = JSON.parse(readFileSync('tuned.json','utf8')).after;
            if (a.tokens.input === b.tokens.input) throw new Error('calibration had no effect on the estimate');
            console.log('ok  estimate honours the calibrated profile:', a.tokens.input, '->', b.tokens.input, 'input tokens');
          "

      - name: the pricing table is not stale
        run: |
          node --input-type=module -e "
            import { pricingAgeDays, PRICING_VERIFIED } from './dist/pricing.js';
            const today = new Date().toISOString().slice(0, 10);
            const age = pricingAgeDays(today);
            console.log('pricing verified', PRICING_VERIFIED, '->', age, 'days old');
            if (age > 120) {
              console.log('::error::pricing table is ' + age + ' days old. Re-verify against the Anthropic pricing page and update PRICING_VERIFIED.');
              process.exit(1);
            }
            if (age > 60) console.log('::warning::pricing table is ' + age + ' days old — re-verify soon.');
          "

      # The shape of the estimate is the claim worth regression-testing: an
      # all-deep graph must cost more than a tiered one, and verification must
      # dominate a graph with three lenses.
      - name: tiering changes the number in the right direction
        run: |
          node dist/cli.js estimate test/fixtures/audit.graph.json --format json > a.json
          node dist/cli.js estimate test/fixtures/expensive.graph.json --format json > b.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const a = JSON.parse(readFileSync('a.json','utf8')).after;
            const b = JSON.parse(readFileSync('b.json','utf8')).after;
            if (b.usd.expected <= a.usd.expected)
              throw new Error('all-deep should cost more: ' + b.usd.expected + ' vs ' + a.usd.expected);
            const top = Object.entries(a.byKind).sort((x,y) => y[1]-x[1])[0][0];
            if (top !== 'verifier') throw new Error('expected verification to dominate, got ' + top);
            console.log('ok  tiered \$' + a.usd.expected.toFixed(2) + ' < all-deep \$' + b.usd.expected.toFixed(2));
          "

      - name: --max-usd fails when the cap is blown
        run: |
          if node dist/cli.js estimate test/fixtures/expensive.graph.json --max-usd 0.01 > /dev/null; then
            echo "::error::--max-usd did not fail"
            exit 1
          fi

      - name: the PR comment carries its update marker
        run: |
          node dist/cli.js estimate test/fixtures/audit.graph.json --format markdown | grep -q 'preflight-cost' \
            || { echo "::error::comment marker missing — the action would duplicate comments"; exit 1; }
